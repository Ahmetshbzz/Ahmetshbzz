<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 44" width="1280" height="44" role="img" aria-label="">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#71717a" stop-opacity="0" />
      <stop offset="0.5" stop-color="#71717a" stop-opacity="0.55" />
      <stop offset="1" stop-color="#71717a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a1a1aa" stop-opacity="0" />
      <stop offset="0.5" stop-color="#e4e4e7" stop-opacity="1" />
      <stop offset="1" stop-color="#a1a1aa" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="sparkLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#71717a" stop-opacity="0" />
      <stop offset="0.5" stop-color="#18181b" stop-opacity="1" />
