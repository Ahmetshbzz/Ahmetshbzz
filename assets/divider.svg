  <line x1="0" y1="22" x2="1280" y2="22" stroke="url(#rail)" stroke-width="1" />
  <rect y="21" width="200" height="2" fill="url(#spark)">
    <animateTransform attributeName="transform" type="translate" from="-200 0" to="1280 0" dur="6.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1" />
